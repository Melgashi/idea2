<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hollywood Dynasty</title>
  <style>
:root {
  --bg: #0f0d0b;
  --bg2: #17140f;
  --panel: #1d1914;
  --panel2: #252019;
  --line: #3a3226;
  --text: #ede6d8;
  --muted: #9a8f7c;
  --gold: #e3b552;
  --gold2: #f6d98c;
  --red: #e2665a;
  --green: #6cc28a;
  --blue: #6aa6e0;
  --elite: #f1c453;
  --good: #6cc28a;
  --ok: #6aa6e0;
  --weak: #b49a6a;
  --bad: #8a6f6f;
  --radius: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: radial-gradient(ellipse at top, #231c12 0%, var(--bg) 55%) fixed, var(--bg);
  color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
}
a { color: inherit; }
h1, h2, h3, h4 { font-family: Georgia, "Times New Roman", serif; font-weight: 600; margin: 0; }
h1 { font-size: 28px; letter-spacing: .3px; }
h2 { font-size: 20px; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 1.6px; color: var(--gold); font-family: system-ui, sans-serif; margin-bottom: 10px; }
h4 { font-size: 13px; color: var(--muted); margin: 12px 0 6px; font-family: system-ui, sans-serif; text-transform: uppercase; letter-spacing: 1px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.pos { color: var(--green); }
.neg { color: var(--red); }

/* top bar */
.topbar {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 10px 20px; background: linear-gradient(180deg, #1c160e, #120f0b);
  border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10;
}
.brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.logo { color: var(--gold); font-size: 26px; text-shadow: 0 0 12px rgba(227,181,82,.5); }
.brand-text { font-family: Georgia, serif; font-size: 20px; letter-spacing: 2px; text-transform: uppercase; }
.brand-text b { color: var(--gold); font-weight: 600; }
.year-box { margin-left: auto; text-align: center; padding: 2px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg2); }
.year-label { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); }
.year-value { font-family: Georgia, serif; font-size: 22px; color: var(--gold2); line-height: 1.1; }
.controls { display: flex; gap: 6px; flex-wrap: wrap; }

.btn {
  background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 12px; font: inherit; cursor: pointer; text-decoration: none; display: inline-block;
}
.btn:hover { border-color: var(--gold); }
.btn.primary { background: linear-gradient(180deg, #e9c066, #c8962f); color: #1a1208; border-color: #c8962f; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.on { background: var(--red); border-color: var(--red); color: #fff; }
.btn.small { padding: 4px 9px; font-size: 12px; }
.btn[disabled] { opacity: .4; cursor: default; }
body.busy .controls .btn { opacity: .6; pointer-events: none; }
body.busy .controls #autoBtn { opacity: 1; pointer-events: auto; }

.tabs { display: flex; gap: 2px; padding: 0 16px; border-bottom: 1px solid var(--line); background: #120f0b; overflow-x: auto; }
.tabs a { padding: 10px 14px; text-decoration: none; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs a:hover { color: var(--text); }
.tabs a.on { color: var(--gold2); border-bottom-color: var(--gold); }
.progress { height: 3px; background: transparent; }
.progress.on { background: var(--bg2); }
.progress .bar { height: 100%; width: 0; background: var(--gold); transition: width .15s; }

main { max-width: 1320px; margin: 0 auto; padding: 20px; }
.loading { padding: 80px; text-align: center; color: var(--muted); }

/* layout */
.pagehead { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.pagehead .seg { margin-left: auto; }
.grid { display: grid; gap: 16px; margin-bottom: 16px; align-items: start; }
.grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.awards { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.grid.sheet-grid { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
@media (max-width: 980px) { .grid.two, .grid.three { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; min-width: 0; }
.card > .tablewrap { margin: 0 -6px; }
.card.gold { border-color: #6b5426; background: linear-gradient(180deg, #2a2112, var(--panel)); }
.hero { background: linear-gradient(135deg, #2a2112, #1a150e); border: 1px solid #6b5426; border-radius: var(--radius); padding: 28px; margin-bottom: 16px; }
.hero h1 { font-size: 34px; color: var(--gold2); margin-bottom: 10px; }
.hero p { max-width: 760px; font-size: 15px; }
.event { background: #2b1f12; border: 1px solid #6b5426; color: var(--gold2); padding: 6px 12px; border-radius: 20px; font-size: 13px; }
.empty { padding: 12px 0; }

.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.stat-v { font-family: Georgia, serif; font-size: 24px; color: var(--gold2); }
.stat-l { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); }
.stat-s { font-size: 12px; color: var(--muted); margin-top: 2px; }

.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.toolbar input, .toolbar select, .menu-section input, .menu-section select {
  background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit;
}
.toolbar input[type=search] { min-width: 220px; }
.yearnav { justify-content: space-between; }
.yearnav h2 { text-align: center; flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { background: var(--panel); color: var(--muted); border: 0; border-right: 1px solid var(--line); padding: 6px 12px; font: inherit; cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--panel2); color: var(--gold2); }

/* tables */
.tablewrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 600; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th.sortable { cursor: pointer; user-select: none; }
.tbl th.sortable:hover { color: var(--gold2); }
.tbl td { padding: 7px 8px; border-bottom: 1px solid #2a241b; vertical-align: top; }
.tbl tr:hover td { background: rgba(255,255,255,.02); }
.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tbl th.num { text-align: right; }
.sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
.pager { display: flex; gap: 12px; align-items: center; justify-content: center; padding: 12px 0 2px; }

.lnk { text-decoration: none; color: var(--text); border-bottom: 1px dotted #5a4d38; }
.lnk:hover { color: var(--gold2); border-bottom-color: var(--gold); }
.lnk.film { font-style: italic; }
.lnk.inactive { color: var(--muted); }
.lnk.plain { border-bottom: 0; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

.score { display: inline-block; min-width: 30px; text-align: center; padding: 1px 6px; border-radius: 5px; font-weight: 600; font-size: 12px; color: #111; }
.s-elite { background: var(--elite); }
.s-good { background: var(--good); }
.s-ok { background: var(--ok); }
.s-weak { background: var(--weak); }
.s-bad { background: var(--bad); color: #eee; }
.grade { display: inline-block; min-width: 26px; text-align: center; padding: 1px 5px; border-radius: 5px; font-weight: 700; font-size: 12px; color: #111; }
.tag { display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: .8px; padding: 1px 6px; border-radius: 4px; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); vertical-align: 1px; font-style: normal; }
.tag.gold { color: var(--gold2); border-color: #6b5426; }
.tag.green { color: var(--green); border-color: #2f5a3d; }
.tag.red { color: var(--red); border-color: #6a2e28; }
.tier { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--line); }
.tier-Major { color: var(--gold2); border-color: #6b5426; }
.tier-Mid { color: var(--blue); border-color: #2c4a66; }
.tier-Indie { color: var(--green); border-color: #2f5a3d; }
.status { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 10px; margin-left: 6px; }
.status.active { background: #1f3a29; color: var(--green); }
.status.retired { background: #2b2b2b; color: #bbb; }
.status.deceased { background: #3a1f1f; color: #e7a7a0; }
.laurel { font-size: 12px; margin-left: 6px; }
.stars { color: var(--gold); letter-spacing: 1px; white-space: nowrap; }
.stars .off { color: #4a4031; }

.meter { display: inline-block; width: 60px; height: 6px; background: #2c261d; border-radius: 3px; vertical-align: middle; overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--blue); }
.meter.fame > span { background: var(--gold); }
.meter.prestige > span { background: #b48ce0; }
.lean { position: relative; display: inline-block; width: 70px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, #b48ce0, #e3b552); vertical-align: middle; }
.lean span { position: absolute; top: -3px; width: 4px; height: 12px; background: #fff; border-radius: 2px; transform: translateX(-2px); }

.plist { list-style: none; padding: 0; margin: 0; }
.plist li { display: flex; align-items: center; gap: 6px; padding: 5px 0; border-bottom: 1px solid #2a241b; flex-wrap: wrap; }
.plist li:last-child { border-bottom: 0; }
.plist .right { margin-left: auto; display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
ol.plist { counter-reset: n; }
ol.plist li::before { counter-increment: n; content: counter(n); color: var(--muted); width: 20px; font-size: 12px; }
.ny { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 4px; }

.news { list-style: none; margin: 0; padding: 0; }
.news li { padding: 6px 0 6px 10px; border-left: 2px solid var(--line); margin-bottom: 4px; }
.news li.nk-awards { border-left-color: var(--gold); }
.news li.nk-boxoffice { border-left-color: var(--green); }
.news li.nk-scandal { border-left-color: var(--red); }
.news li.nk-studio { border-left-color: var(--blue); }
.news li.nk-event { border-left-color: #b48ce0; }
.news li.nk-people { border-left-color: #888; }

.bars .barrow { display: grid; grid-template-columns: 80px 1fr 44px; gap: 8px; align-items: center; padding: 2px 0; font-size: 13px; }
.bb { height: 8px; background: #2c261d; border-radius: 4px; overflow: hidden; }
.bb span { display: block; height: 100%; background: var(--blue); }
.bb span.hot { background: var(--gold); }
.bb span.cold { background: #6b5f50; }
.bv { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

.aw-row { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid #3a2f1c; flex-wrap: wrap; }
.aw-cat { color: var(--muted); width: 170px; font-size: 13px; }
.aw-win { flex: 1; min-width: 160px; }
.noms { list-style: none; margin: 0; padding: 0; }
.noms li { display: grid; grid-template-columns: 26px 1fr; padding: 6px 0; border-bottom: 1px solid #2a241b; }
.noms li .sub { grid-column: 2; }
.noms li.won { color: var(--gold2); }
.noms li.won .lnk { color: var(--gold2); font-weight: 600; }
.statue.off { color: #4a4031; text-align: center; }
.lifetime { font-size: 18px; font-family: Georgia, serif; }
.awl { list-style: none; padding: 0; margin: 0; }
.awl li { padding: 5px 0; border-bottom: 1px solid #2a241b; }
.awl li.won { color: var(--gold2); }

.kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 10px; margin: 10px 0 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }

/* character sheet */
.sheet-head { display: flex; gap: 18px; align-items: center; background: linear-gradient(135deg, #2a2112, var(--panel)); border: 1px solid #6b5426; border-radius: var(--radius); padding: 18px; margin-bottom: 16px; flex-wrap: wrap; }
.avatar { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; font-family: Georgia, serif; font-size: 26px; color: #1a1208; flex: none; }
.avatar.gM { background: linear-gradient(135deg, #8fb5dc, #4f79a8); }
.avatar.gF { background: linear-gradient(135deg, #e5a8b8, #b26683); }
.who { flex: 1; min-width: 220px; }
.who .meta { color: var(--muted); margin: 4px 0 8px; }
.traits { display: flex; gap: 6px; flex-wrap: wrap; }
.trait { font-size: 12px; padding: 2px 9px; border-radius: 12px; background: #2f271b; border: 1px solid #5a4a30; cursor: help; }
.trait.spec { background: #1d2a36; border-color: #2c4a66; color: #a9cbed; }
.trait.gold { color: var(--gold2); border-color: var(--gold); }
.ovr { text-align: center; padding: 0 10px; }
.ovr-v { font-family: Georgia, serif; font-size: 40px; font-weight: 700; color: #111; border-radius: 12px; padding: 2px 14px; display: inline-block; }
.ovr-l { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); margin-bottom: 4px; }
.statline { display: grid; grid-template-columns: 130px 1fr 32px; gap: 10px; align-items: center; padding: 4px 0; }
.sl { color: var(--muted); font-size: 13px; }
.sb { height: 9px; background: #2c261d; border-radius: 5px; overflow: hidden; }
.sb > span { display: block; height: 100%; border-radius: 5px; }
.sb > span.fame { background: var(--gold); }
.sb > span.prestige { background: #b48ce0; }
.sv { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.statline:has(.delta) { grid-template-columns: 130px 1fr 32px 44px; }
.delta { font-size: 11px; font-variant-numeric: tabular-nums; }

/* studio & film heads */
.studiohead { border-left: 6px solid hsl(var(--hue), 60%, 55%); padding-left: 14px; }
.studiohead .meta, .finfo .meta { color: var(--muted); margin-top: 4px; }
.filmhead { display: flex; gap: 20px; margin-bottom: 16px; flex-wrap: wrap; }
.poster {
  width: 170px; height: 250px; flex: none; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; justify-content: flex-end;
  background: linear-gradient(160deg, hsl(var(--hue), 45%, 32%), hsl(var(--hue), 40%, 10%));
  border: 1px solid hsl(var(--hue), 30%, 35%); box-shadow: 0 8px 24px rgba(0,0,0,.4);
}
.pt { font-family: Georgia, serif; font-size: 20px; line-height: 1.15; text-transform: uppercase; letter-spacing: 1px; }
.pg, .py { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: rgba(255,255,255,.7); margin-top: 6px; }
.finfo { flex: 1; min-width: 260px; }
.finfo .stats-row { margin-top: 14px; }

.chart { display: flex; align-items: flex-end; gap: 2px; height: 160px; padding-bottom: 18px; }
.chart .col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; position: relative; min-width: 3px; }
.chart .col span { background: linear-gradient(180deg, var(--gold), #9a7426); border-radius: 2px 2px 0 0; }
.chart .col:hover span { background: var(--gold2); }
.chart .col i { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--muted); font-style: normal; }

/* modal & toast */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal[hidden] { display: none; }
.modal-card { background: var(--panel); border: 1px solid #6b5426; border-radius: 12px; padding: 22px; width: min(440px, 100%); max-height: 90vh; overflow: auto; }
.modal-card h2 { color: var(--gold2); margin-bottom: 12px; }
.menu-section { border-top: 1px solid var(--line); padding: 12px 0; display: flex; flex-direction: column; gap: 8px; }
.menu-section label { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.menu-section label.btn { display: inline-block; text-align: center; }
.close { width: 100%; margin-top: 6px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--gold); padding: 10px 18px; border-radius: 8px; z-index: 60; box-shadow: 0 6px 20px rgba(0,0,0,.5); }

@media (max-width: 640px) {
  main { padding: 12px 16px; }
  .topbar { padding: 8px 16px; gap: 10px; }
  .brand-text { font-size: 16px; }
  .year-box { margin-left: 0; }
  .controls { width: 100%; }
  .controls .btn { flex: 1; padding: 7px 6px; font-size: 13px; }
  h1 { font-size: 22px; }
  .aw-cat { width: 100%; }
  .statline { grid-template-columns: 100px 1fr 30px; }
  .kv { grid-template-columns: 110px 1fr; }
  .poster { width: 120px; height: 176px; }
}

/* career stories */
.story { margin-bottom: 16px; }
.story-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.story-head h3 { margin: 0; }
.story-body { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 20px; }
@media (max-width: 980px) { .story-body { grid-template-columns: 1fr; } }
.bio p { margin: 0; line-height: 1.65; font-size: 14.5px; }
.arc { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); white-space: nowrap; }
.arc.sm { font-size: 11px; padding: 1px 7px; }
.arc-legend, .arc-riseRise, .arc-st-summit { color: var(--gold2); border-color: #6b5426; }
.arc-riseFall, .arc-fallFall, .arc-flameOut, .arc-oneHit, .arc-st-fall { color: #e7a7a0; border-color: #6a2e28; }
.arc-comeback, .arc-bloomer, .arc-rising, .arc-st-breakout, .arc-st-comeback { color: var(--green); border-color: #2f5a3d; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.sw { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.sw.fame { background: #bd8a2c; }
.sw.prestige { background: #9a76c8; }
.sw.win { width: 9px; height: 9px; border-radius: 50%; background: var(--panel); border: 2px solid var(--gold2); }
.sw.scandal { width: 9px; height: 9px; border-radius: 50%; background: var(--panel); border: 2px solid var(--red); }
.cchart-wrap { position: relative; }
.cchart { width: 100%; height: auto; display: block; touch-action: pan-y; }
.cchart .grid { stroke: #2c261d; stroke-width: 1; }
.cchart .ax { fill: var(--muted); font-size: 10px; }
.cchart .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.cchart .ln.fame { stroke: #bd8a2c; }
.cchart .ln.prestige { stroke: #9a76c8; }
.cchart .ev { fill: var(--panel); stroke-width: 2; }
.cchart .ev.win { stroke: var(--gold2); }
.cchart .ev.scandal { stroke: var(--red); }
.cchart .xh { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.ctip { position: absolute; top: 4px; width: 160px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; pointer-events: none; box-shadow: 0 6px 18px rgba(0,0,0,.45); }
.ctip .muted { margin: 4px 0; }
.spark { display: block; }
.spark polyline { fill: none; stroke: #bd8a2c; stroke-width: 1.5; stroke-linejoin: round; }
.news li.nk-story { border-left-color: var(--green); }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand" data-go="#/">
      <span class="logo">★</span>
      <span class="brand-text">Hollywood <b>Dynasty</b></span>
    </div>
    <div class="year-box">
      <div class="year-label">Year</div>
      <div class="year-value" id="yearValue">—</div>
    </div>
    <div class="controls">
      <button class="btn primary" data-action="advance" data-years="1">▶ Next Year</button>
      <button class="btn" data-action="advance" data-years="5">⏩ 5 Years</button>
      <button class="btn" data-action="advance" data-years="10">⏭ 10 Years</button>
      <button class="btn" data-action="auto" id="autoBtn">⟳ Auto</button>
      <button class="btn ghost" data-action="menu">☰</button>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <a href="#/">Overview</a>
    <a href="#/studios">Studios</a>
    <a href="#/talent">Talent</a>
    <a href="#/films">Films</a>
    <a href="#/awards">Golden Laurels</a>
    <a href="#/stories">Stories</a>

  }

  RNG.prototype.next = function () {
    var t = (this.s = (this.s + 0x6d2b79f5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);

    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

  RNG.prototype.int = function (a, b) { return Math.floor(this.range(a, b + 1)); };

    var w = {
      version: 2,
      seed: seed,
      startYear: opts.startYear || 1980,
      year: opts.startYear || 1980, // next year to simulate
      people: [],
      studios: [],
      films: [],
      awards: {},
      history: [],
      news: [],
      trends: {},
      usedNames: {},
      usedTitles: {},
      rngState: 0
    };
    HW.GENRE_KEYS.forEach(function (g) { w.trends[g] = clamp(rng.normal(1, 0.12), 0.7, 1.3); });
    w.trends['Superhero'] = 0.45; // a niche genre... for now

    HW.ROLE_KEYS.forEach(function (role) {
      for (var i = 0; i < HW.ROLES[role].target; i++) createPerson(w, rng, role, { initial: true });
    });

    var names = rng.shuffle(HW.STUDIO_NAMES.slice());
    var tiers = [];
    var i;
    for (i = 0; i < 6; i++) tiers.push('Major');
    for (i = 0; i < 8; i++) tiers.push('Mid');
    for (i = 0; i < 8; i++) tiers.push('Indie');
    tiers.forEach(function (tier, idx) {
      createStudio(w, rng, tier, { name: names[idx], founded: w.startYear - rng.int(tier === 'Major' ? 40 : 2, tier === 'Major' ? 70 : 30) });
    });

    w.rngState = rng.s;
    HW.addNews(w, w.startYear, 'The curtain rises on ' + w.startYear + ' Hollywood: ' + w.studios.length + ' studios and ' +

      if (!w.usedNames[n]) { w.usedNames[n] = 1; return n; }
    }
    var base = rng.pick(gender === 'M' ? HW.NAMES.male : HW.NAMES.female) + ' ' + rng.pick(HW.NAMES.last);
    var k = 2;

    return base + ' ' + roman(k);

    if (prev) prev.cast.forEach(function (x) { prevCast[x.p] = x.r; });
    var spent = d.fee + (wr ? wr.fee : 0);
    roles.forEach(function (role, idx) {
      var pool = role.g === 'M' ? ctx.pools.actorM : ctx.pools.actorF;
      var h = hire(ctx, pool, f, B * role.share, function (p) {
        if (castIds[p.id]) return -1e9;
        var age = Y - p.born;
        if (age < role.age[0] || age > role.age[1]) return -1e9;
        var st = p.stats, apt = HW.genreApt(p, genre);
        var q = apt * 0.4 + (st.craft * 0.3 + st.intensity * 0.12 + st.range * 0.1 + st.chemistry * 0.08) * 10;
        var sc = q * (1 - 0.3 * c) + (1 - c) * p.prestige * 0.25 + c * p.fame * (role.r === 'L' ? 0.4 : 0.15);
        if (role.r === 'L' && genre !== 'Animation') sc += c * (st.presence - 5) * 1.5;
        if (prevCast[p.id] === role.r) sc += 40;
        if (collab[p.id]) sc += 4;
        return sc;
      });
      if (!h) return;
      if (castIds[h.p.id]) return;
      castIds[h.p.id] = 1;
      spent += h.fee;
      f.cast.push({ p: h.p.id, r: role.r, perf: 0, fee: Math.round(h.fee * 100) / 100, cut: h.cut || undefined });
    });
    f.talentCost = Math.round(spent * 10) / 10;
  }

  function G_spec(genre) { return HW.GENRES[genre].spectacle; }

  // ---------- release & box office ----------
  function pickMonth(f, rng) {
    var G = HW.GENRES[f.genre];
    var r = rng.next();
    if (G.spectacle >= 0.6 && f.budget > 40) return r < 0.6 ? rng.pick([4, 5, 6]) : r < 0.85 ? rng.pick([10, 11]) : rng.int(0, 11);
    if (G.awards >= 3 && f.commercial < 0.55) return r < 0.6 ? rng.pick([9, 10, 11]) : rng.int(0, 11);
    if (f.genre === 'Horror') return r < 0.4 ? 9 : r < 0.6 ? rng.pick([0, 1]) : rng.int(0, 11);
    if (f.genre === 'Family' || f.genre === 'Animation') return r < 0.5 ? rng.pick([5, 6, 10, 11]) : rng.int(0, 11);
    return rng.int(0, 11);
  }
  var MONTH_BO = [0.82, 0.85, 0.95, 0.97, 1.12, 1.2, 1.22, 1.0, 0.85, 0.95, 1.08, 1.15];

  function releaseFilms(w, ctx) {
    var rng = ctx.rng, Y = ctx.year;
    ctx.films.forEach(function (f) {
      f.month = pickMonth(f, rng);
      f.title = makeTitle(w, rng, f);
    });
    ctx.films.forEach(function (f) { scoreFilm(w, ctx, f); });
    // critics and audiences judge against what they're used to: drift the reference toward this year's median
    var med = function (arr) { arr.sort(function (a, b) { return a - b; }); return arr[arr.length >> 1]; };
    if (ctx.films.length) {
      // films compete within their market segment (blockbusters vs. blockbusters, indies vs. indies)
      ctx.seg = {};
      ctx.films.forEach(function (f) {
        var t = w.studios[f.studio].tier, g = ctx.seg[t] || (ctx.seg[t] = { n: 0, aud: 0, crit: 0 });
        g.n++; g.aud += f.audience; g.crit += f.critic;
      });
      for (var t in ctx.seg) { ctx.seg[t].aud /= ctx.seg[t].n; ctx.seg[t].crit /= ctx.seg[t].n; }
      w.ref.q = w.ref.q * 0.8 + 0.2 * med(ctx.films.map(function (f) { return f.sc.q; }));
      w.ref.ent = w.ref.ent * 0.8 + 0.2 * med(ctx.films.map(function (f) { return f._ent; }));
      ctx.films.forEach(function (f) { delete f._ent; });
    }
    var byMonth = {};
    ctx.films.forEach(function (f) { (byMonth[f.month] = byMonth[f.month] || []).push(f); });

    ctx.films.forEach(function (f) {
      var G = HW.GENRES[f.genre];
      var leads = f.cast.filter(function (x) { return x.r === 'L'; }).map(function (x) { return w.people[x.p]; });
      var fames = leads.map(function (p) { return p.fame + (HW.has(p, 'magnet') ? 15 : 0); }).sort(function (a, b) { return b - a; });
      var star = (fames[0] || 0) + (fames[1] || 0) * 0.4;
      var dirFame = w.people[f.director].fame;
      var base = 2 + Math.pow(f.budget, 0.95) * 1.7 + star * 0.55 + dirFame * 0.2;
      var rivals = (byMonth[f.month] || []).filter(function (o) { return o !== f && o.budget >= f.budget * 0.6; }).length;
      var seg = ctx.seg[w.studios[f.studio].tier];
      var mult = Math.exp((f.audience - seg.aud) / 32) * Math.exp((f.critic - seg.crit) / 110) *
        Math.pow(w.trends[f.genre], 0.9) * G.appeal * MONTH_BO[f.month] * ctx.mods.boxOffice /
        (1 + 0.05 * rivals) * Math.exp(rng.normal(0, 0.38));
      if (G.spectacle >= 0.6) mult *= ctx.mods.spectacleBO;
      if (G.awards >= 3) mult *= ctx.mods.prestigeBO;
      if (f.seqOf != null) {
        var prev = w.films[f.seqOf];
        mult *= clamp(prev.audience / 65, 0.7, 1.3) * [1, 1, 1.05, 0.9, 0.78, 0.68][f.seqNum] * Math.pow(0.93, ctx.seqCount[f.genre] || 0);
        base += Math.min(prev.gross, 1200) * 0.15;
      }
      if (f.budget < 20 && f.critic >= 84 && rng.chance(0.35)) { mult *= rng.range(2.5, 7); f.tags.push('sleeper'); }
      var gross = base * mult;
      if (gross > 800) gross = 800 + (gross - 800) / (1 + (gross - 800) / 1600); // even mega-hits saturate
      f.gross = Math.round(gross * 10) / 10;
      var marketing = f.budget * 0.45 + 0.5;
      var cost = f.budget * (1 + f.overrun) + marketing;
      var revenue = f.gross * 0.5 + f.gross * 0.12 * ctx.mods.ancillary;
      f.profit = Math.round((revenue - cost) * 10) / 10;
      if (f.profit < -40 || (f.profit < 0 && f.gross < f.budget * 0.6 && f.budget > 30)) f.tags.push('flop');
      if (f.gross / f.budget > 5 && f.gross > 100) f.tags.push('smash');

      f.id = w.films.length;
      w.films.push(f);
      var s = w.studios[f.studio];
      s.films.push(f.id);
      s.cash = Math.round((s.cash + f.profit) * 10) / 10;
    });

    // headlines
    var sorted = ctx.films.slice().sort(function (a, b) { return b.gross - a.gross; });
    if (sorted[0]) {
      var top = sorted[0];
      var allTime = w.films.every(function (o) { return o === top || o.gross < top.gross; });
      HW.addNews(w, Y, (allTime ? 'RECORD! ' : '') + '"' + top.title + '" (' + w.studios[top.studio].name + ') is the year\'s #1 movie with ' +
        HW.money(top.gross) + (allTime ? ' — the biggest box office of all time.' : '.'), 'boxoffice', { f: top.id });
    }
    ctx.films.forEach(function (f) {
      if (f.tags.indexOf('sleeper') >= 0) HW.addNews(w, Y, 'Sleeper hit: tiny "' + f.title + '" turns a ' + HW.money(f.budget) + ' budget into ' + HW.money(f.gross) + '.', 'boxoffice', { f: f.id });
      if (f.tags.indexOf('flop') >= 0 && f.budget >= 120) HW.addNews(w, Y, 'Disaster: "' + f.title + '" bombs, costing ' + w.studios[f.studio].name + ' ' + HW.money(-f.profit) + '.', 'boxoffice', { f: f.id });
    });
  }

  function scoreFilm(w, ctx, f) {
    var rng = ctx.rng, G = HW.GENRES[f.genre];
    var dir = w.people[f.director];
    var wr = f.writer != null ? w.people[f.writer] : null;
    var dp = f.dp != null ? w.people[f.dp] : null;
    var cm = f.composer != null ? w.people[f.composer] : null;
    var dirHandling = (dir.stats.actorHandling - 50) * 0.12 + (HW.has(dir, 'actorsdir') ? 4 : 0);
    var dialogue = wr ? (wr.stats.dialogue - 50) * 0.06 + (HW.has(wr, 'wordsmith') ? 2 : 0) : -3;

    var actSum = 0, actW = 0, charSum = 0, charW = 0, chemTotal = 0;
    f.cast.forEach(function (c) { chemTotal += w.people[c.p].stats.chemistry; });
    f.cast.forEach(function (c) {
      var p = w.people[c.p], s = p.stats;
      var method = HW.has(p, 'method');
      // chemistry: scene partners lift (or flatten) each other
      var partners = f.cast.length > 1 ? (chemTotal - s.chemistry) / (f.cast.length - 1) : 5;
      var perf = HW.genreApt(p, f.genre) * 0.35 + (s.craft * 0.25 + s.intensity * 0.2 + s.range * 0.1 + s.presence * 0.1) * 10 +
        (partners - 5) * 1.2 + dirHandling + dialogue + (method ? 3 : 0);
      // craft is consistency: skilled actors deliver take after take; intensity swings bigger
      var sd = 10 - s.craft * 0.5 + (method ? 3 : 0) + (s.intensity - 5) * 0.3;
      c.perf = Math.round(clamp(perf + rng.normal(0, Math.max(2.5, sd)), 1, 99));
      var wgt = c.r === 'L' ? 2 : 1;
      actSum += c.perf * wgt; actW += wgt;
      if (c.r === 'L') { charSum += (s.presence * 0.75 + s.chemistry * 0.25) * 10 + (HW.GENRES[f.genre].core.physicality || 0) * (s.physicality - 5) * 3; charW++; }
    });
    var acting = actW ? actSum / actW : 40;
    var starAppeal = charW ? charSum / charW : 45;

    var script = wr ? wr.stats.originality * 0.35 + wr.stats.structure * 0.35 + wr.stats.dialogue * 0.3 + specBonus(wr, f.genre, 5) : 38;
    if (f.seqOf != null) script -= 4 + f.seqNum;
    script += rng.normal(0, 6);
    var direction = dir.stats.vision * 0.5 + dir.stats.craft * 0.5 + specBonus(dir, f.genre, 4) + rng.normal(0, 5);
    var tech = dp ? dp.stats.visuals * 0.5 + dp.stats.technique * 0.3 + dp.stats.innovation * 0.2 + rng.normal(0, 5) : 40;
    var music = cm ? cm.stats.melody * 0.4 + cm.stats.atmosphere * 0.4 + cm.stats.versatility * 0.2 + rng.normal(0, 5) : 40;
    var spectacle = G.spectacle * clamp(Math.log(f.budget + 1) / Math.log(250), 0, 1.1) * 100 * ctx.mods.spectacle +
      (dp ? (dp.stats.technique - 50) * 0.3 * G.spectacle : 0) + rng.normal(0, 6);

    var overrun = clamp(rng.normal(0.05, 0.08) + (60 - dir.stats.efficiency) * 0.003, -0.05, 0.6);
    var perfectionist = HW.has(dir, 'perfectionist') || (dp && HW.has(dp, 'perfectionist'));
    if (perfectionist) { overrun += rng.range(0.1, 0.3); direction += 3; tech += 3; }
    f.overrun = Math.round(overrun * 100) / 100;
    var friction = f.cast.some(function (c) { return HW.has(w.people[c.p], 'diva'); }) || HW.has(dir, 'diva') ? rng.normal(-2, 3) : 0;
    var chemistry = rng.normal(0, 3) + friction;

    var quality = script * 0.3 + direction * 0.28 + acting * 0.27 + tech * 0.08 + music * 0.07 + chemistry;
    var auteur = HW.has(dir, 'auteur');
    var ref = w.ref || (w.ref = { q: 62, ent: 52 });
    var critic = 52 + (quality - ref.q) * 1.8 + G.critic + (auteur ? 4 : 0) + (HW.has(dir, 'darling') ? 3 : 0) + rng.normal(0, 6);
    var ent = script * 0.24 + direction * 0.2 + starAppeal * 0.24 + acting * 0.14 + spectacle * 0.14 +
      (HW.has(dir, 'hitmaker') || (wr && HW.has(wr, 'hitmaker')) ? 4 : 0) + (dir.stats.commercial - 50) * 0.08 +
      (cm && HW.has(cm, 'hummable') ? 2 : 0) + (auteur ? -3 : 0);
    f._ent = ent;
    var audience = 56 + (ent - ref.ent) * 1.6 + (critic - 55) * 0.1 + rng.normal(0, 6);

    f.critic = Math.round(clamp(critic, 2, 99));
    f.audience = Math.round(clamp(audience, 5, 99));
    f.sc = {
      q: Math.round(quality), script: Math.round(script), dir: Math.round(direction), act: Math.round(acting),
      tech: Math.round(tech), music: Math.round(music), fx: Math.round(spectacle)
    };
  }

  function makeTitle(w, rng, f) {
    if (f.seqOf != null) {
      var root = w.films[f.root];
      var base = root.title;
      return rng.chance(0.65) ? base + ' ' + f.seqNum : base + ': ' + rng.pick(['Part ' + roman(f.seqNum), 'Reckoning', 'Resurrection', 'Legacy', 'The Return', 'Rise', 'Endgame', 'Revenge', 'Origins', 'Homecoming']);
    }
    var T = HW.TITLE, used = w.usedTitles;
    for (var i = 0; i < 20; i++) {
      var pat = rng.pick(T.patterns[f.genre]);
      var title = pat.replace('{adj}', rng.pick(T.adj)).replace('{noun}', rng.pick(T.noun)).replace('{place}', rng.pick(T.place))
        .replace('{first2}', rng.pick(rng.chance(0.5) ? HW.NAMES.male : HW.NAMES.female))
        .replace('{first}', rng.pick(rng.chance(0.5) ? HW.NAMES.male : HW.NAMES.female)).replace('{last}', rng.pick(HW.NAMES.last))
        .replace('{verbed}', rng.pick(T.verbed)).replace('{num}', String(rng.int(1, 9) * 100 + rng.int(0, 99)));
      if (!used[title]) { used[title] = f.year; return title; }
      if (i > 12 && used[title] < f.year - 15) { used[title] = f.year; return title; } // a remake
    }
    var t2 = rng.pick(T.adj) + ' ' + rng.pick(T.noun) + ' ' + rng.pick(T.place);
    used[t2] = f.year;
    return t2;
  }
  function roman(n) { return ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'][n] || String(n); }

  // ---------- careers ----------
  function gainFame(p, d) {
    if (d > 0) d *= Math.pow(1 - p.fame / 106, 1.3);
    p.fame = clamp(p.fame + d, 0, 100);
  }
  function gainPrestige(p, d) {
    if (d > 0) d *= Math.pow(1 - p.prestige / 106, 1.3) * (HW.has(p, 'darling') ? 1.4 : 1);
    p.prestige = clamp(p.prestige + d, 0, 100);
  }
  HW.gainFame = gainFame;
  HW.gainPrestige = gainPrestige;

  function careerUpdates(w, ctx) {
    var Y = ctx.year, rng = ctx.rng;
    ctx.worked = {};
    ctx.films.forEach(function (f) {
      var boxo = clamp(Math.log2(f.gross / 60 + 0.25) * 3, -6, 13);
      var aud = (f.audience - 60) / 12, crit = (f.critic - 60) / 7;
      f.cast.forEach(function (c) {
        var p = w.people[c.p], wgt = c.r === 'L' ? 1 : 0.5;
        credit(p, f, ctx);
        p.exp += c.r === 'L' ? 1.2 : 0.8;
        p.gross += f.gross;
        gainFame(p, wgt * (boxo + aud + (c.perf - 60) / 15) + (HW.has(p, 'heartthrob') && Y - p.born < 32 ? 2 : 0));
        gainPrestige(p, wgt * (crit * 0.6 + (c.perf - 60) / 8));
        var gd = HW.growGenres(p, f, c.perf, c.r === 'L');
        if (!p.gLast || p.gLast.y !== Y) p.gLast = { y: Y, d: {} };
        for (var g in gd) p.gLast.d[g] = Math.round(((p.gLast.d[g] || 0) + gd[g]) * 100) / 100;
        if (!p.bestPerf || c.perf > p.bestPerf.v) p.bestPerf = { v: c.perf, f: f.id };
      });
      [['director', 1], ['writer', 0.5], ['dp', 0.3], ['composer', 0.3]].forEach(function (x) {
        var id = f[x[0]];
        if (id == null) return;
        var p = w.people[id];
        credit(p, f, ctx);
        p.exp += 1;
        if (x[0] === 'director') p.gross += f.gross;
        gainFame(p, x[1] * (boxo * 0.8 + aud));
        gainPrestige(p, x[1] * crit * 1.1);
      });
    });
  }
  function credit(p, f, ctx) {
    if (p.films[p.films.length - 1] !== f.id) p.films.push(f.id);
    p.lastWorked = ctx.year;
    ctx.worked[p.id] = 1;
  }

  // ---------- studios ----------
  function studioYearEnd(w, ctx) {
    var Y = ctx.year, rng = ctx.rng;
    var active = w.studios.filter(function (s) { return s.active; });
    active.forEach(function (s) {
      var t = TIER[s.tier];
      var mine = ctx.films.filter(function (f) { return f.studio === s.id; });
      s.cash -= t.overhead;
      if (s.cash < 0) s.cash *= 1.07; // interest on debt
      var payout = s.cash > t.reserve ? (s.cash - t.reserve) * 0.35 : 0; // parent company / shareholders take profits
      s.cash -= payout;
      s.cash = Math.round(s.cash * 10) / 10;
      var gross = 0, profit = 0, crit = 0, wins = 0, noms = 0;
      mine.forEach(function (f) { gross += f.gross; profit += f.profit; crit += f.critic; wins += f.wins; noms += f.noms; });
      var avgCrit = mine.length ? crit / mine.length : 50;
      s.prestige = Math.round(clamp(s.prestige * 0.75 + 0.25 * (avgCrit + wins * 4 + noms * 0.5), 0, 100));
      s.commercial = HW.round1(clamp(s.commercial + rng.normal(0, 0.03), 0.05, 0.95) * 100) / 100;
      s.paidOut = Math.round((s.paidOut || 0) + payout);
      s.yearly.push({ y: Y, n: mine.length, g: Math.round(gross), p: Math.round(profit), c: Math.round(s.cash), w: wins, nm: noms, tier: s.tier });

      // tier movement
      if (s.tier === 'Indie' && s.cash > 260 && s.prestige > 50 && tierCount(w, 'Mid') < 11) promote(w, s, 'Mid', Y);
      else if (s.tier === 'Mid' && s.cash > 950 && tierCount(w, 'Major') < 8) promote(w, s, 'Major', Y);
      else if (s.tier === 'Major' && s.cash < -250) demote(w, s, 'Mid', Y);
      else if (s.tier === 'Mid' && s.cash < -90) demote(w, s, 'Indie', Y);

      if (s.cash < TIER[s.tier].floor) s.debtYears++; else s.debtYears = 0;
      if (s.debtYears >= 2 || s.cash < TIER[s.tier].floor * 2) collapse(w, s, ctx);
    });

    var count = w.studios.filter(function (s) { return s.active; }).length;
    var newOnes = Math.max(0, 20 - count);
    if (count < 30 && rng.chance(0.15)) newOnes++;
    for (var i = 0; i < newOnes; i++) {
      var tier = rng.chance(0.2) ? 'Mid' : 'Indie';
      var s = HW.createStudio(w, rng, tier, { founded: Y + 1 });
      HW.addNews(w, Y, 'New player in town: ' + s.name + ' opens its doors as a' + (tier === 'Mid' ? ' mid-size' : 'n independent') + ' studio.', 'studio', { s: s.id });
    }
  }
  function tierCount(w, tier) {
    return w.studios.filter(function (s) { return s.active && s.tier === tier; }).length;
  }
  function promote(w, s, tier, Y) {
    s.tier = tier;
    HW.addNews(w, Y, s.name + ' rises to ' + (tier === 'Major' ? 'major-studio status' : 'mid-size studio') + ' after a run of hits.', 'studio', { s: s.id });
  }
  function demote(w, s, tier, Y) {
    s.tier = tier;
    HW.addNews(w, Y, 'Cutbacks at ' + s.name + ': the struggling studio downsizes to ' + (tier === 'Mid' ? 'a mid-size' : 'an independent') + ' operation.', 'studio', { s: s.id });
  }
  function collapse(w, s, ctx) {
    var rng = ctx.rng, Y = ctx.year;
    var buyers = w.studios.filter(function (o) { return o.active && o !== s && o.cash > 400; });
    s.active = false;
    s.closed = Y;
    if (buyers.length && rng.chance(0.65)) {
      var b = rng.weighted(buyers, function (o) { return o.cash; });
      b.cash = Math.round(b.cash - Math.max(20, -s.cash * 0.2));
      b.prestige = Math.round(clamp(b.prestige + (s.prestige - b.prestige) * 0.15, 0, 100));
      s.fate = { type: 'acquired', by: b.id, y: Y };
      HW.addNews(w, Y, b.name + ' acquires the bankrupt ' + s.name + ', absorbing its film library.', 'studio', { s: b.id });
    } else {
      s.fate = { type: 'closed', y: Y };
      HW.addNews(w, Y, 'End of an era: ' + s.name + ' (founded ' + s.founded + ') shuts down after crippling losses.', 'studio', { s: s.id });
    }
  }

  // ---------- people: decay, scandals, aging, retirement, newcomers ----------
  function peopleYearEnd(w, ctx) {
    var Y = ctx.year, rng = ctx.rng, N = Y + 1;
    var counts = {};
    HW.ROLE_KEYS.forEach(function (r) { counts[r] = 0; });

    w.people.forEach(function (p) {
      if (p.status === 'deceased') return;
      var age = N - p.born;
      if (p.status === 'active') {
        // fame/prestige drift
        if (!ctx.worked[p.id]) { p.fame = clamp(p.fame - 1.5 - p.fame * 0.06, 0, 100); p.prestige = clamp(p.prestige - 0.6, 0, 100); }
        else p.fame = clamp(p.fame - p.fame * 0.04, 0, 100);
        p.prestige = clamp(p.prestige - Math.max(0, p.prestige - 60) * 0.05, 0, 100);
        if (HW.has(p, 'heartthrob') && age > 40) p.fame = clamp(p.fame - 2, 0, 100);

        // scandals
        if ((p.role === 'actor' || p.role === 'director') && p.fame > 30) {
          var sp = HW.has(p, 'scandal') ? 0.08 : 0.005;
          if (rng.chance(sp)) {
            var what = rng.pick(['a messy public feud', 'a tabloid exposé', 'an on-set meltdown', 'a DUI arrest', 'a leaked recording', 'a bitter divorce', 'a contract walkout']);
            if (rng.chance(0.2)) { HW.gainFame(p, rng.range(3, 8)); HW.addNews(w, Y, p.name + ' rides out ' + what + ' — any publicity is good publicity.', 'scandal', { p: p.id }); }
            else { p.fame = clamp(p.fame - rng.range(5, 18), 0, 100); p.prestige = clamp(p.prestige - rng.range(2, 8), 0, 100); HW.addNews(w, Y, 'Scandal: ' + p.name + ' embroiled in ' + what + '.', 'scandal', { p: p.id }); }
            p.scandalYear = Y;
            (p.scandals = p.scandals || []).push(Y);
          }
        }

    ], s.yearly.slice().reverse(), { per: 15 }));

  function filmTable(key, films, o) {
    o = o || {};
    var cols = [
      { h: 'Year', cls: 'num', v: function (f) { return f.year; } },
      { h: 'Title', v: function (f) { return f.title; }, html: function (f) { return fLink(f.id) + tags(f); } }
    ];

    cols.push(
      { h: 'Genre', v: function (f) { return f.genre; } },
      { h: 'Director', v: function (f) { return W().people[f.director].name; }, html: function (f) { return pLink(f.director); } },
      { h: 'Budget', cls: 'num', v: function (f) { return f.budget; }, html: function (f) { return money(f.budget); } },
      { h: 'Gross', cls: 'num', v: function (f) { return f.gross; }, html: function (f) { return money(f.gross); } },
      { h: 'Critics', cls: 'num', v: function (f) { return f.critic; }, html: function (f) { return scoreBadge(f.critic); } },
      { h: 'Audience', cls: 'num', v: function (f) { return f.audience; }, html: function (f) { return scoreBadge(f.audience); } },
      { h: 'Laurels', cls: 'num', v: function (f) { return f.wins * 100 + f.noms; }, html: function (f) { return f.noms ? (f.wins ? '🏆' + f.wins + ' ' : '') + '<span class="muted">' + f.noms + 'n</span>' : ''; } }
    );
    return table(key, cols, films, { per: o.per || 25 });

  function tags(f) {
    var t = '';
    if (f.won.indexOf('picture') >= 0) t += ' <span class="tag gold">Best Picture</span>';
    if (f.tags.indexOf('smash') >= 0) t += ' <span class="tag green">Smash</span>';
    if (f.tags.indexOf('sleeper') >= 0) t += ' <span class="tag green">Sleeper</span>';
    if (f.tags.indexOf('flop') >= 0) t += ' <span class="tag red">Flop</span>';
    return t;
  }

  function personPage(id) {
    var w = W(), p = w.people[+id];

      }).join('') + '<p class="muted small">Genre skills grow with every role, faster when the film lands with critics, audiences and the box office. Flops can set them back. Arrows show last year\'s change.</p>');
    }
    var bp = p.bestPerf ? w.films[p.bestPerf.f] : null;
    h += card('Standing', '<div class="statline"><span class="sl">Fame</span><span class="sb">' + '<span class="fame" style="width:' + p.fame + '%"></span></span><span class="sv">' + Math.round(p.fame) + '</span></div>' +
      '<div class="statline"><span class="sl">Prestige</span><span class="sb"><span class="prestige" style="width:' + p.prestige + '%"></span></span><span class="sv">' + Math.round(p.prestige) + '</span></div>' +
      '<dl class="kv"><dt>Asking fee</dt><dd>' + money(HW.fee(p)) + ' / film</dd>' +
      '<dt>Films</dt><dd>' + p.films.length + '</dd>' +
      '<dt>Career gross</dt><dd>' + money(p.gross) + '</dd>' +
      '<dt>Golden Laurels</dt><dd>' + p.wins + ' wins / ' + p.noms + ' nominations</dd>' +
      (bp ? '<dt>Best performance</dt><dd>' + fLink(bp.id) + ' (' + bp.year + ') — ' + grade(p.bestPerf.v) + '</dd>' : '') +
      '<dt>Last worked</dt><dd>' + (p.lastWorked || '—') + '</dd></dl>');
    h += card('Golden Laurels', awards.length ? '<ul class="awl">' + awards.map(function (a) {
      return '<li class="' + (a.won ? 'won' : '') + '"><span class="ny">' + yLink(a.y) + '</span> ' + (a.won ? '🏆 <b>Won</b> ' : 'Nominated ') + HW.catName(a.k) + ' — ' + fLink(a.f) + '</li>';
    }).join('') + '</ul>' : empty('No nominations yet.'));
    h += card('Frequent collaborators', collaborators(p));
    h += '</div>';

    var films = p.films.map(function (fid) { return w.films[fid]; }).reverse();
    h += card('Filmography', table('pf-' + p.id, [
      { h: 'Year', cls: 'num', v: function (f) { return f.year; } },
      { h: 'Title', v: function (f) { return f.title; }, html: function (f) { return fLink(f.id) + tags(f); } },
      { h: 'Credit', v: function (f) { return creditOf(f, p.id); } },
      { h: 'Studio', html: function (f) { return sLink(f.studio); } },
      { h: 'Genre', v: function (f) { return f.genre; } },
      { h: 'Perf.', cls: 'num', v: function (f) { var c = castOf(f, p.id); return c ? c.perf : null; }, html: function (f) { var c = castOf(f, p.id); return c ? '<span class="grade ' + scoreCls(c.perf) + '">' + grade(c.perf) + '</span>' : ''; } },
      { h: 'Gross', cls: 'num', v: function (f) { return f.gross; }, html: function (f) { return money(f.gross); } },
      { h: 'Critics', cls: 'num', v: function (f) { return f.critic; }, html: function (f) { return scoreBadge(f.critic); } }
    ], films, { per: 30 }));
    h += '</div>';
    return h;
  }
  function initials(n) { return esc(n.split(' ').map(function (x) { return x[0]; }).slice(0, 2).join('')); }
  function castOf(f, pid) { for (var i = 0; i < f.cast.length; i++) if (f.cast[i].p === pid) return f.cast[i]; return null; }
  function creditOf(f, pid) {
    var c = castOf(f, pid);
    if (c) return c.r === 'L' ? 'Lead' : 'Supporting';
    if (f.director === pid) return 'Director';
    if (f.writer === pid) return 'Writer';
    if (f.dp === pid) return 'Cinematography';
    if (f.composer === pid) return 'Music';
    return '';
  }
  function collaborators(p) {
    var w = W(), count = {};
    p.films.forEach(function (fid) {
      var f = w.films[fid];
      var ids = f.cast.map(function (c) { return c.p; }).concat([f.director, f.writer, f.dp, f.composer]);
      ids.forEach(function (id) { if (id != null && id !== p.id) count[id] = (count[id] || 0) + 1; });
    });
    var top = Object.keys(count).filter(function (k) { return count[k] >= 2; }).sort(function (a, b) { return count[b] - count[a]; }).slice(0, 8);
    if (!top.length) return empty('No repeat collaborators yet.');
    return '<ul class="plist">' + top.map(function (id) {
      return '<li>' + pLink(+id) + ' <span class="muted small">' + HW.ROLES[w.people[id].role].label + '</span><span class="right">' + count[id] + ' films</span></li>';
    }).join('') + '</ul>';
  }

    h += '<div class="toolbar yearnav">' + (i > 0 ? '<a class="btn small" href="#/awards/' + years[i - 1] + '">‹ ' + years[i - 1] + '</a>' : '<span></span>') +

    var y = function (v) { return T + (1 - v / 100) * (Ht - T - B); };
    var line = function (arr) { return arr.map(function (v, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(v).toFixed(1); }).join(''); };

      '<div class="cchart-wrap"><svg class="cchart" viewBox="0 0 ' + Wd + ' ' + Ht + '" data-l="' + L + '" data-r="' + R + '" data-n="' + n + '" data-w="' + Wd + '" data-t="' + T + '" data-b="' + (Ht - B) + '" role="img" aria-label="Fame and prestige by year">' +
      g + '<line class="xh" y1="' + T + '" y2="' + (Ht - B) + '" x1="-10" x2="-10"/></svg><div class="ctip" hidden></div>' +
      '<script type="application/json" class="cdata">' + JSON.stringify(data).replace(/</g, '\\u003c') + '<\/script></div>'; // escaped so the single-file build stays valid

  UI.chartHover = function (e) {

  function storiesPage() {

  <script>
// Boot, persistence (IndexedDB), and input handling.
(function (HW) {
  var DB = 'hollywood-dynasty', STORE = 'saves', KEY = 'current';
  var busy = false, autoTimer = null;

  function openDb() {
    return new Promise(function (res, rej) {
      if (!window.indexedDB) return rej(new Error('IndexedDB unavailable'));
      var r = indexedDB.open(DB, 1);
      r.onupgradeneeded = function () { r.result.createObjectStore(STORE); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function save() {
    return openDb().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put(JSON.stringify(HW.world), KEY);
        tx.oncomplete = function () { res(); };
        tx.onerror = function () { rej(tx.error); };
      });
    }).catch(function (e) { console.warn('Save failed', e); toast('Could not save: ' + e.message); });
  }
  function load() {
    return openDb().then(function (db) {
      return new Promise(function (res) {
        var r = db.transaction(STORE, 'readonly').objectStore(STORE).get(KEY);
        r.onsuccess = function () { res(r.result ? JSON.parse(r.result) : null); };
        r.onerror = function () { res(null); };
      });
    }).catch(function () { return null; });
  }

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { t.hidden = true; }, 3200);
  }
  HW.toast = toast;

  function progress(frac) {
    var p = document.getElementById('progress');
    p.classList.toggle('on', frac != null);
    document.getElementById('progressBar').style.width = ((frac || 0) * 100) + '%';
  }

  function advance(n) {
    if (busy) return Promise.resolve();
    busy = true;
    document.body.classList.add('busy');
    var done = 0;
    return new Promise(function (resolve) {
      function step() {
        HW.simulateYear(HW.world);
        done++;
        progress(done / n);
        if (done < n) setTimeout(step, 0);
        else {
          save().then(function () {
            busy = false;
            document.body.classList.remove('busy');
            progress(null);
            HW.UI.render();
            resolve();
          });
        }
      }
      setTimeout(step, 0);
    });
  }

  function setAuto(on) {
    var btn = document.getElementById('autoBtn');
    if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
    btn.classList.toggle('on', on);
    btn.textContent = on ? '■ Stop' : '⟳ Auto';
    if (!on) return;
    var tick = function () {
      advance(1).then(function () {
        if (!btn.classList.contains('on')) return;
        autoTimer = setTimeout(tick, +document.getElementById('autoSpeed').value);
      });
    };
    tick();
  }

  function newWorld() {
    var start = parseInt(document.getElementById('newStart').value, 10) || 1980;
    var seedTxt = document.getElementById('newSeed').value.trim();
    var seed = seedTxt ? hash(seedTxt) : undefined;
    setAuto(false);
    HW.world = HW.newWorld({ startYear: start, seed: seed });
    HW.UI.sorts = {}; HW.UI.pages = {}; HW.UI.filters = {};
    save();
    closeMenu();
    location.hash = '#/';
    HW.UI.render();
    toast('A new Hollywood is born — seed ' + HW.world.seed);
  }
  function hash(s) {
    if (/^\d+$/.test(s)) return +s;
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  function exportSave() {
    var blob = new Blob([JSON.stringify(HW.world)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'hollywood-dynasty-' + HW.world.year + '.json';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }
  function importSave(file) {
    var r = new FileReader();
    r.onload = function () {
      try {
        var w = JSON.parse(r.result);
        if (!w || !w.people || !w.studios || !w.films) throw new Error('not a Hollywood Dynasty save');
        if (w.version !== 2) throw new Error('this save is from an older version');
        setAuto(false);
        HW.world = w;
        save();
        closeMenu();
        location.hash = '#/';
        HW.UI.render();
        toast('Save loaded — year ' + w.year);
      } catch (e) { toast('Import failed: ' + e.message); }
    };
    r.readAsText(file);
  }

  function openMenu() {
    var w = HW.world;
    document.getElementById('saveInfo').textContent = 'Seed ' + w.seed + ' · started ' + w.startYear + ' · ' + w.films.length.toLocaleString() + ' films, ' + w.people.length.toLocaleString() + ' people on record. Autosaves in this browser after every year.';
    document.getElementById('menu').hidden = false;
  }
  function closeMenu() { document.getElementById('menu').hidden = true; }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-action],[data-sort],[data-page],[data-filter],[data-go]');
    if (!t) return;
    if (t.dataset.go) { location.hash = t.dataset.go; return; }
    if (t.dataset.sort) {
      var p = t.dataset.sort.split(':'), key = p[0], col = +p[1], cur = HW.UI.sorts[key];
      HW.UI.sorts[key] = { c: col, d: cur && cur.c === col ? -cur.d : (t.classList.contains('num') ? -1 : 1) };
      HW.UI.render(); return;
    }
    if (t.dataset.page) { var q = t.dataset.page.split(':'); HW.UI.pages[q[0]] = Math.max(0, +q[1]); HW.UI.render(); window.scrollTo(0, 0); return; }
    if (t.dataset.filter) {
      var f = t.dataset.filter.split(':');
      HW.UI.filters[f[0]] = f[1];
      Object.keys(HW.UI.pages).forEach(function (k) { if (/^talent|^films|^studios/.test(k)) HW.UI.pages[k] = 0; });
      HW.UI.render(); return;
    }
    switch (t.dataset.action) {
      case 'advance': setAuto(false); advance(+t.dataset.years); break;

  document.getElementById('importFile').addEventListener('change', function (e) { if (e.target.files[0]) importSave(e.target.files[0]); e.target.value = ''; });

  document.addEventListener('change', function (e) {

    if (e.target.id !== 'talentSearch') return;
    clearTimeout(searchTimer);
    var v = e.target.value;
    searchTimer = setTimeout(function () {
      HW.UI.filters.q = v;
      HW.UI.pages['talent-' + (HW.UI.filters.role || 'actor')] = 0;
      HW.UI.render();
      var el = document.getElementById('talentSearch');
      if (el) { el.focus(); el.setSelectionRange(v.length, v.length); }
    }, 200);
  });
  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.key === ' ' || e.key === 'n') { e.preventDefault(); advance(1); }

  document.addEventListener('mousemove', function (e) { HW.UI.chartHover(e); });
  document.addEventListener('touchstart', function (e) { if (e.touches[0]) HW.UI.chartHover({ target: e.target, clientX: e.touches[0].clientX }); }, { passive: true });
  window.addEventListener('hashchange', function () { HW.UI.render(); window.scrollTo(0, 0); });

  load().then(function (w) {
    HW.world = w && w.version === 2 ? w : HW.newWorld({ startYear: 1980 });
    if (w && w.version !== 2) toast('Actor stats were redesigned, so older saves can\'t load. A fresh world has started.');
    if (HW.world !== w) save();
    HW.UI.render();
  });
})(globalThis.HW = globalThis.HW || {});
